[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trade-leads"
version = "0.1.0"
description = "Find local trades businesses and score them as missed-call-text-back prospects"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "click>=8.1.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "anthropic>=0.30.0",
    "google-auth-oauthlib>=1.0.0",
    "google-api-python-client>=2.0.0",
    "psycopg2-binary>=2.9.0",
]

[project.scripts]
trade-leads = "trade_leads.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["trade_leads"]
